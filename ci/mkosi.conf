[Distribution]
Distribution=fedora
Release=44
Architecture=arm64

[Output]
Format=tar
CompressOutput=zstd
Output=adsp-sc598-rootfs
OutputDirectory=mkosi.output

[Content]
# Do not install a UEFI bootloader or generate a UKI/ESP partition
Bootable=no

# Fedora's Cortex-A55 packages pull in selinux-policy-targeted. Relabelling
# during an unprivileged cross-build rarely works cleanly. Disable it and let
# the running system handle policy on first boot.
SELinuxRelabel=no

# Keep package manager metadata so dnf is usable inside the rootfs
CleanPackageMetadata=no

Packages=
        systemd
        systemd-udev
        util-linux
        bash
        coreutils
        iproute
        NetworkManager
        openssh-server
        procps-ng
        ethtool
        ca-certificates
        shadow-utils    # /etc/shadow + passwd binary — required to authenticate any login
        passwd          # set root password on first boot
        cracklib-dicts  # password dictionary for pam_pwquality
        sudo
        dnf             # package manager
        iputils         # ping

# Do NOT install the kernel or kernel-modules since we build our own.
# Explicitly remove them even if they were dragged in as dependencies.
RemovePackages=
        kernel
        kernel-core
        kernel-modules
        kernel-modules-core
        kernel-modules-extra
