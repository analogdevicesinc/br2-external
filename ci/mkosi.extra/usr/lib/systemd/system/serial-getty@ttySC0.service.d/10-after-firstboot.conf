[Unit]
# Keep agetty off /dev/ttySC0 until firstboot-user.service has created the
# first user. Condition*= is re-evaluated at start-job time (not just once
# at boot), so on the boot where firstboot-user.service actually runs,
# its OnSuccess= requeues us and this condition is simply re-checked and
# found true by then.
ConditionPathExists=/var/lib/firstboot-user-done
