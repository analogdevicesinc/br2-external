name: Build ADI artifacts

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner (defaults to vars.RUNNER)'
        type: string
        default: ""
      path:
        description: "Configuration trees, space separated if many (defaults to '.')"
        type: string
        default: "."
      defconfig:
        description: Buildroot defconfig
        required: true
        type: string
      flavor:
        description: Configuration flavor
        required: false
        type: string
        default: ''
      app-token-repositories:
        description: "Repositories to scope a GitHub App Token to"
        type: string
        default: ""
  workflow_call:
    inputs:
      runner:
        type: string
        default: ""
      path:
        type: string
        default: "."
      defconfig:
        required: true
        type: string
      flavor:
        required: false
        type: string
        default: ''
      app-token-repositories:
        type: string
        default: ""
    secrets:
      APP_CLIENT_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || vars.RUNNER != '' && fromJSON(vars.RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: write

    steps:
      - uses: actions/create-github-app-token@v3
        if: ${{ github.repository_owner == 'adi-innersource' }}
        id: app-token
        with:
          app-id: ${{ secrets.APP_CLIENT_ID  }}
          private-key: ${{ secrets.APP_PRIVATE_KEY  }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.app-token-repositories }}
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          submodules: recursive
          persist-credentials: false

      - name: Persist token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          { git config --global --get-regexp '^url\..*\.insteadOf$' || :; } |
            awk '$2 == "https://github.com/" { print $1 }' |
            xargs -r -n1 git config --global --unset-all
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Resolve BR2_EXTERNAL
        env:
          BR2_EXTERNAL_PATHS: ${{ inputs.path }}
        run: |
          set -- $BR2_EXTERNAL_PATHS
          br2_base=$(realpath -e "$1")
          br2_external=$(realpath -e "$@")
          echo "br2_base=${br2_base}" >> "$GITHUB_ENV"
          echo "br2_external=${br2_external//$'\n'/ }" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          cd "${br2_base}/buildroot"
          umask 022
          make distclean
          make BR2_EXTERNAL="${br2_external}" ${{ inputs.defconfig }}
          fragments=()
          for name in buildroot ${{ inputs.flavor }}; do
            found=
            for tree in ${br2_external}; do
              f="${tree}/configs/${name}.fragment"
              [ -f "$f" ] && fragments+=("$f") && found=y
            done
            [ -n "$found" ] || { echo "::error::${name}.fragment not found"; exit 1; }
          done
          support/kconfig/merge_config.sh .config "${fragments[@]}"
          make -j$(nproc)

      - name: Build SDK
        if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        run: |
          cd "${br2_base}/buildroot"
          make sdk -j$(nproc)

      - name: Generate SBOM
        run: |
          [[ "${{ runner.debug }}" == "1" ]] && set -x
          image_path="${br2_base}/buildroot/output/images"

          defconfig="${{ inputs.defconfig }}"
          [ -n "${{ inputs.flavor }}" ] && defconfig="${defconfig}-${{ inputs.flavor }}"

          # buildroot >= 2024.05
          cd "${br2_base}/buildroot"
          make show-info \
            | utils/generate-cyclonedx \
                --project-name "$defconfig" \
                --project-version "${{ github.ref_name }}" \
            > "${image_path}/sbom.json"

      - name: Prepare image names
        run: |
          image_name="${{ inputs.defconfig }}"
          [ -z "${{ inputs.flavor }}" ] || image_name="${image_name}-${{ inputs.flavor }}"
          echo "image_name=$image_name" >> "$GITHUB_ENV"

      - name: Upload Buildroot images
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.image_name }}
          path: ${{ env.br2_base }}/buildroot/output/images

      - name: Clean-up
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          git config --global --remove-section \
            "url.https://x-access-token:${GH_TOKEN}@github.com/" || :
